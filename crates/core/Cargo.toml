[package]
name = "pmsig-core"
description = "Shared types and domain-separated hash formulas for the private M-of-N multisig. Compiles for both host and risc0 guest."
version.workspace = true
edition.workspace = true
# Guest-shared crate: this is compiled inside the pinned reproducible builder
# (risc0-guest-builder r0.1.91.1), whose guest rustc is 1.91.1-dev — older than the 1.94 host
# toolchain the workspace pins to match LEZ v0.2.4. Declaring the workspace's 1.94 here made
# `cargo risczero build` fail with "rustc 1.91.1-dev is not supported". This value is not a guess:
# the reproducible build is what verifies it.
rust-version = "1.91"
license.workspace = true
repository.workspace = true

[dependencies]
borsh.workspace = true
serde.workspace = true
risc0-zkvm.workspace = true

[dev-dependencies]
lee_core = { workspace = true, features = ["host"] }
hex.workspace = true

[lints]
workspace = true
