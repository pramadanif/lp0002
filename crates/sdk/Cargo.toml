[package]
name = "pmsig-sdk"
description = "Client-side SDK: proof generation and transaction building for shielded multisig members."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pmsig-core.workspace = true
pmsig-membership-core.workspace = true
pmsig-multisig-core.workspace = true
pmsig-store.workspace = true
thiserror.workspace = true
# Default features (client + bonsai) drive the external `r0vm` that rzup installs. The in-process
# `prove` feature is deliberately NOT enabled: on macOS it compiles Metal kernels, which needs full
# Xcode, and an evaluator on a clean Mac would hit a build failure rather than a working demo.
risc0-zkvm = { version = "3.0.6", features = ["std"] }
lee_core = { workspace = true, features = ["host"] }

[dev-dependencies]
hex.workspace = true
# Only to recompute a committed binary's ImageID in tests/image_ids_match_binaries.rs.
risc0-binfmt = "3.0.5"
pmsig-store.workspace = true
serde_json.workspace = true
borsh.workspace = true

[lints]
workspace = true
