[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/sdk",
    "crates/cli",
    "crates/store",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pramadanif/lp0002"

[workspace.dependencies]
pmsig-core = { path = "crates/core" }
pmsig-sdk = { path = "crates/sdk" }
pmsig-store = { path = "crates/store" }

anyhow = "1"
borsh = { version = "1.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# ── Lint policy ──────────────────────────────────────────────────────────────
# Guests abort the proof on panic, so panicking constructs are denied in library
# code and allowed only in tests. CI runs `clippy -D warnings`.
[workspace.lints.rust]
unused_must_use = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[profile.release]
opt-level = 3
lto = true
