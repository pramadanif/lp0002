[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/sdk",
    "crates/cli",
    "crates/store",
    "crates/membership-core",
    "crates/guest-tools",
    "crates/multisig-core",
]
# Guests cross-compile to riscv32im-risc0-zkvm-elf and are built separately, not as workspace members.
exclude = ["programs/membership-lez", "programs/multisig-spel"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pramadanif/lp0002"

[workspace.dependencies]
pmsig-core = { path = "crates/core" }
pmsig-sdk = { path = "crates/sdk" }
pmsig-store = { path = "crates/store" }
pmsig-membership-core = { path = "crates/membership-core" }
pmsig-multisig-core = { path = "crates/multisig-core" }

anyhow = "1"
borsh = { version = "1.5", features = ["derive"] }

# LEZ, pinned to the revision the live testnet runs (docs/VERSIONS.md). We depend on lee_core
# rather than reimplementing its hashes, so byte-compatibility is structural, not asserted.
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }
# Same version LEZ v0.2.4 pins; default-features off keeps guest cross-compilation free of `ring`.
risc0-zkvm = { version = "3.0.6", default-features = false, features = ["std"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# ── Lint policy ──────────────────────────────────────────────────────────────
# Guests abort the proof on panic, so panicking constructs are denied in library
# code and allowed only in tests. CI runs `clippy -D warnings`.
[workspace.lints.rust]
unused_must_use = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[profile.release]
opt-level = 3
lto = true
